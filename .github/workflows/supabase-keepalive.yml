name: Supabase keepalive

on:
  schedule:
    - cron: "17 5,13,21 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-question:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Read one public question
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --retry 2 \
            --retry-all-errors \
            --retry-delay 2 \
            --connect-timeout 5 \
            --max-time 15 \
            --header "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            --output /dev/null \
            "${SUPABASE_URL%/}/rest/v1/questions?select=id&limit=1"
